name: RG pipeline

on:
  push:
    branches:
      - 'features/*'

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: features/Plan
    permissions:
      contents: read
      id-token: write
    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Format
        run: terraform fmt 

      - name: Terraform Validate
        run: terraform validate

        approval:
        needs: scan
        runs-on: ubuntu-latest

        environment:
        name: terraform-plan-approval

        steps:
        - name: Approval
          run: echo "Approval received"

        - name: Terraform Plan
          run: terraform plan